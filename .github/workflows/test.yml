name: test

# Runs the read-only/safe-mode guard and .cnf-newline-injection tests on every push to main and
# every PR against it. Both are safety nets people rely on when pointing this at a production
# server, so a regression should fail the check rather than only being caught by hand-testing
# later - previously these only ran when someone remembered to run them locally.
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    # windows-latest ships PowerShell 7 (pwsh) already, matching this app's actual target
    # platform - no extra setup needed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Test-SqlReadOnly tests
        shell: pwsh
        run: ./tests/Test-SqlReadOnly.Tests.ps1 ./NOBSSQL.ps1

      - name: Run Get-CnfSafe tests
        shell: pwsh
        run: ./tests/Get-CnfSafe.Tests.ps1 ./NOBSSQL.ps1

      # viewIndices decides the order every result grid is displayed in. It is JavaScript embedded
      # in NOBSSQL.ps1, so the test extracts it and runs it under node rather than the PowerShell
      # AST the other two use. windows-latest already ships node, so there is nothing to install.
      # The Users dialog builds CREATE USER / GRANT / DROP USER client-side as text, so the
      # quoting it does is the only thing standing between a user name and the server.
      - name: Run Users-dialog SQL tests
        shell: pwsh
        run: ./tests/UserSql.Tests.ps1 ./NOBSSQL.ps1
      - name: Run viewIndices tests
        shell: pwsh
        run: ./tests/ViewIndices.Tests.ps1 ./NOBSSQL.ps1

      # tests/Live.Tests.ps1 is deliberately NOT run here: it needs a real database, and
      # windows-latest has none (GitHub's service containers are Linux-only, while this app
      # targets Windows). Without NOBS_TEST_DSN it prints SKIPPED and exits 0, so adding it would
      # turn a green check into a claim about work that never ran. It is a local gate instead -
      # see docs/TESTING.md.
