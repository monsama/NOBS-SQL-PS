name: test

# Runs the read-only/safe-mode guard and .cnf-newline-injection tests on every push to main and
# every PR against it. Both are safety nets people rely on when pointing this at a production
# server, so a regression should fail the check rather than only being caught by hand-testing
# later - previously these only ran when someone remembered to run them locally.
on:
  push:
    branches: [main]
  pull_request: {}
  # Weekly, because the tools-download job below depends on someone else's website keeping its
  # shape - MariaDB's release API, and the HTML of MySQL's download page that that download reads
  # its checksum out of. Neither needs a commit here to break, so without a schedule the first
  # report comes from a user whose download button stopped working. Monday morning, and
  # deliberately not on the hour (GitHub delays scheduled runs at popular times). Note GitHub
  # disables scheduled workflows in a repository with no pushes for 60 days, and emails first.
  schedule:
    - cron: '17 6 * * 1'
  # So the same checks can be run on demand, including the scheduled-only step below.
  workflow_dispatch: {}

jobs:
  test:
    # windows-latest ships PowerShell 7 (pwsh) already, matching this app's actual target
    # platform - no extra setup needed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Test-SqlReadOnly tests
        shell: pwsh
        run: ./tests/Test-SqlReadOnly.Tests.ps1 ./NOBSSQL.ps1

      - name: Run Get-CnfSafe tests
        shell: pwsh
        run: ./tests/Get-CnfSafe.Tests.ps1 ./NOBSSQL.ps1

      # viewIndices decides the order every result grid is displayed in. It is JavaScript embedded
      # in NOBSSQL.ps1, so the test extracts it and runs it under node rather than the PowerShell
      # AST the other two use. windows-latest already ships node, so there is nothing to install.
      # The Users dialog builds CREATE USER / GRANT / DROP USER client-side as text, so the
      # quoting it does is the only thing standing between a user name and the server.
      # The app is one file and the UI is inline JavaScript inside it. A file-level syntax
      # error takes the entire page down - no theme, no connections, nothing clickable - and the
      # per-function tests below cannot see it, because they evaluate functions in isolation.
      - name: Run UI parse check
        shell: pwsh
        run: ./tests/UiParses.Tests.ps1 ./NOBSSQL.ps1
      - name: Run Users-dialog SQL tests
        shell: pwsh
        run: ./tests/UserSql.Tests.ps1 ./NOBSSQL.ps1
      - name: Run viewIndices tests
        shell: pwsh
        run: ./tests/ViewIndices.Tests.ps1 ./NOBSSQL.ps1

      # Which columns of a loaded table are binary. Nothing tells this edition with the result, so
      # it reads the declared types when the table loads - and what it must not do is answer for a
      # column that is not one of the table's.
      - name: Run binary column tests
        shell: pwsh
        run: ./tests/GridBinCols.Tests.ps1 ./NOBSSQL.ps1

      # The MariaDB and MySQL clients name their SSL options mutually exclusively, so choosing the
      # wrong set does not weaken the connection, it stops it outright. This needs no database: it
      # asks the client binary, which parses the options file before it ever opens a socket.
      - name: Run SSL options tests
        shell: pwsh
        run: ./tests/SslLines.Tests.ps1 ./NOBSSQL.ps1

      # A batch that comes back non-zero may have stopped at a bad statement (nothing applied) or
      # lost its connection (nobody knows). Only one of those can be described with confidence.
      - name: Run batch failure message tests
        shell: pwsh
        run: ./tests/BatchFailureNote.Tests.ps1 ./NOBSSQL.ps1

      # MySQL 8 authenticates with caching_sha2_password by default, which is a client-side plugin
      # the downloaded tools were not unpacking - so the app could not connect to one at all.
      - name: Run client plugin directory tests
        shell: pwsh
        run: ./tests/PluginDir.Tests.ps1 ./NOBSSQL.ps1

      # The CA certificate has to survive every save and load path; the bug that actually happens is
      # one of them rebuilding the connection from parts and quietly dropping it.
      - name: Run connection CA certificate tests
        shell: pwsh
        run: ./tests/ConnSslCa.Tests.ps1 ./NOBSSQL.ps1

      # Restoring a per-database dump into a different target used to drop and rebuild the SOURCE
      # database, because the file's own USE overrode the chosen target.
      - name: Run dump target tests
        shell: pwsh
        run: ./tests/DumpTarget.Tests.ps1 ./NOBSSQL.ps1

      # Result rows come from mysql --xml, the only output that tells NULL from the text 'NULL'.
      # The reader is checked against real output from both clients (MySQL's writes CRLF).
      - name: Run result row tests
        shell: pwsh
        run: ./tests/ResultRows.Tests.ps1 ./NOBSSQL.ps1

      # The designer rewrote whatever it does not show (DECIMAL scale, UNSIGNED, fractional
      # seconds, character set) on any edit, and renamed a column by dropping it.
      - name: Run table designer tests
        shell: pwsh
        run: ./tests/TableDesigner.Tests.ps1 ./NOBSSQL.ps1

      # MariaDB's mysqldump cannot make a restorable dump of a MySQL table with generated columns,
      # so a MySQL server gets MySQL's own tools when there are any.
      - name: Run tool choice tests
        shell: pwsh
        run: ./tests/ToolChoice.Tests.ps1 ./NOBSSQL.ps1

      # The new-version notice: announced when newer, quiet when hidden, switched off or offline.
      - name: Run update notice tests
        shell: pwsh
        run: ./tests/UpdateCheck.Tests.ps1 ./NOBSSQL.ps1

      # Six of the tests here carry a copy of a test that lives in the Tauri edition, because both
      # editions ship the same UI. A stale copy fails nothing - it keeps passing against whatever
      # it last knew about - so the copies are compared against the originals rather than trusted.
      - name: Check out nobs-sql-editor (the shared UI tests)
        uses: actions/checkout@v7
        with:
          repository: monsama/nobs-sql-editor
          path: editor
          sparse-checkout: tests/ui
          sparse-checkout-cone-mode: false

      - name: Check the shared UI tests are in step
        shell: pwsh
        run: ./tests/SharedUiTests.Tests.ps1 ./editor

      # Which table a result grid saves to, and control characters shown in text.
      - name: Run table binding tests
        shell: pwsh
        run: ./tests/TableBinding.Tests.ps1 ./NOBSSQL.ps1

      # Saving grid edits: every change must match exactly one row.
      - name: Run grid save tests
        shell: pwsh
        run: ./tests/GridSave.Tests.ps1 ./NOBSSQL.ps1

      # On MySQL a failed recreate of a procedure/function/trigger left it dropped.
      - name: Run DDL recreate tests
        shell: pwsh
        run: ./tests/DdlRecreate.Tests.ps1 ./NOBSSQL.ps1

  # The live suite against real MariaDB and MySQL servers, started on this runner by the setup
  # script in nobs-sql-editor (which also holds the shared fixture). MySQL is unpacked where a real
  # installation lives, so the app finds MySQL's own client there, and MariaDB's client tools go
  # where the app's own download puts them.
  live:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check out nobs-sql-editor (setup script and fixture)
        uses: actions/checkout@v7
        with:
          repository: monsama/nobs-sql-editor
          path: editor

      - name: Cache server downloads
        uses: actions/cache@v6
        with:
          path: C:\nobs-ci\cache
          key: nobs-ci-servers-${{ hashFiles('editor/tests/ci/start-test-servers.ps1') }}

      - name: Start MariaDB and MySQL
        shell: pwsh
        run: ./editor/tests/ci/start-test-servers.ps1

      - name: Live tests against MariaDB
        shell: pwsh
        run: |
          $env:NOBS_TEST_DSN = $env:NOBS_CI_MARIADB_DSN
          $env:NOBS_TEST_SERVER_CA = $env:NOBS_CI_MARIADB_CA
          ./tests/Live.Tests.ps1 ./NOBSSQL.ps1

      # NOBS_TEST_REMOTE_HOST adds verify-ca over this runner's own network address, which only
      # MySQL's client can do against MySQL's self-generated certificate.
      - name: Live tests against MySQL
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:NOBS_TEST_DSN = $env:NOBS_CI_MYSQL_DSN
          $env:NOBS_TEST_SERVER_CA = $env:NOBS_CI_MYSQL_CA
          $env:NOBS_TEST_REMOTE_HOST = $env:NOBS_CI_REMOTE_HOST
          ./tests/Live.Tests.ps1 ./NOBSSQL.ps1

      # The app driven through its UI in headless Edge: grid edits, Compare, export and import, a
      # script's results. The scenarios are shared with the desktop edition and live in its
      # repository (tests/gui), next to the setup script above.
      - name: Install Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: GUI tests against MariaDB
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:NOBS_TEST_DSN = $env:NOBS_CI_MARIADB_DSN
          # Exit 3 means the run never reached a scenario: the window did not open, the browser
          # did not answer, the database did not connect. Nothing was evaluated, so trying again
          # hides nothing - and the line it prints is what makes the frequency countable later.
          # Any other failure is a check that found something and fails the build as it is.
          node editor/tests/gui/run.mjs --app ps --target ./NOBSSQL.ps1
          if ($LASTEXITCODE -eq 3) {
            "  the app never started - trying once more (exit 3)"
            node editor/tests/gui/run.mjs --app ps --target ./NOBSSQL.ps1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GUI tests against MySQL
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:NOBS_TEST_DSN = $env:NOBS_CI_MYSQL_DSN
          # Exit 3 means the run never reached a scenario: the window did not open, the browser
          # did not answer, the database did not connect. Nothing was evaluated, so trying again
          # hides nothing - and the line it prints is what makes the frequency countable later.
          # Any other failure is a check that found something and fails the build as it is.
          node editor/tests/gui/run.mjs --app ps --target ./NOBSSQL.ps1
          if ($LASTEXITCODE -eq 3) {
            "  the app never started - trying once more (exit 3)"
            node editor/tests/gui/run.mjs --app ps --target ./NOBSSQL.ps1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Server logs
        if: ${{ failure() }}
        shell: pwsh
        run: Get-Content C:\nobs-ci\mariadb.err, C:\nobs-ci\mysql.err -Tail 60 -ErrorAction SilentlyContinue

  # The two buttons in Settings that fetch and unpack the client tools, run for real. The job above
  # evaluates pure functions and the live suite uses tools the setup script installs directly, so
  # this is the only check that exercises the download itself - the release API's file list and
  # published SHA-256, MySQL's download page and the MD5 printed on it, and the unpacking of the
  # binaries and the authentication plugins. It needs no database.
  tools-download:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # MariaDB's archive is ~90 MB, so this runs on every push. The test writes into a temporary
      # tree rather than %APPDATA%, and refuses to run at all unless the variable below is set.
      - name: Download and verify the MariaDB client tools
        shell: pwsh
        env:
          NOBS_TEST_TOOLS_DOWNLOAD: '1'
        run: ./tests/ToolsDownload.Tests.ps1 ./NOBSSQL.ps1

      # MySQL's is ~270 MB (the whole server archive, of which two binaries are kept) and its
      # version, file name and MD5 come out of the page's HTML rather than an API - so it is the
      # likelier of the two to break and the more expensive to check. Weekly and on demand, then:
      # a restyled page breaks the download whether or not anyone pushed that week, which is what
      # a scheduled run is for, and putting it on every push would only make those slower.
      - name: Download and verify the MySQL client tools
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          NOBS_TEST_TOOLS_DOWNLOAD: '1'
        run: ./tests/ToolsDownload.Tests.ps1 ./NOBSSQL.ps1 -Mysql
